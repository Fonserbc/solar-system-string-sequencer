<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Solar System String Sequencer</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <script type="module" src="/main.js"></script>
    <div id="canvas-container">
        <canvas id="canvas" class="selectDisable"></canvas>
    </div>
    <div id="safe-area">
      <div id="overlay-ui">
      <h1>Solar System String Sequencer</h1>
      <div id="instructions">
        <p id="tuto"><u>click & drag</u> to build strings between celestial bodies,</p>
        <p id="time">currently current time passing at 12 days/s,</p>
        <p id="speed">sound on strings moving at a speed of c</p>
      </div>
      <div id="planets">
      </div>
      <div id="actions">
        <p id="space">[Spacebar] toggle top-down view</p>
        <p id="delete">[Delete] all strings  from selected</p>
        <p id="all">[A]dd all strings from selected</p>
        <p id="debug">toggle [D]ebug</p>
      </div>
      </div>
    </div>
  </body>
</html>
